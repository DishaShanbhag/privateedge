# Generate the Xcode project with:  cd ios/App && xcodegen
# (PrivateEdge.xcodeproj is generated, not committed.)
name: PrivateEdge
options:
  bundleIdPrefix: edu.nyu.privateedge
  deploymentTarget:
    iOS: "17.0"
packages:
  PrivateEdgeCore:
    path: ../PrivateEdgeCore
targets:
  PrivateEdge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Bundle          # exported by harness/export_ios_bundle.py
        type: folder
        buildPhase: resources
    dependencies:
      - package: PrivateEdgeCore
    entitlements:
      path: PrivateEdge.entitlements
      properties:
        # Raises the per-app memory limit; the proposal enables it as margin.
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PrivateEdge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Model files go in, and results come out, through Finder / the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""   # set your team in Xcode (Signing & Capabilities)
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
