# + verification (calendar: source spans, deterministic date resolution; notes: quote and grounding checks)
inherits: C2.yaml
verification: true
verifier:
  calendar_crosscheck: nsdatadetector   # null turns the NSDataDetector check off (ablation)
  span_policy: drop_and_merge          # v2 after dev run 1; strict = v1 (see CHANGELOG)
  recovery: clarify                     # as proposed; b0 and repair are ablations (C3_fallback_b0, C3_repair)
  notes_grounding: note             # answer entities must occur in the cited notes; v1 (as proposed) = quote (see CHANGELOG)
  notes_retrieval_threshold: 0.0    # tuned on dev 2026-11-19: any higher value only adds false abstentions
