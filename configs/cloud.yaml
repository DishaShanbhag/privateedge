# Cloud baseline. Same items, prompts, C2 retrieved chunks and output schema as local.
provider: google
model: gemini-3.8-flash     # stable; log the returned model version with every response
temperature: default
thinking_level: low
save_raw_responses: true
api_key_env: GEMINI_API_KEY # set in .env, never commit
max_retries: 3              # only for 429/500/503 (capacity), with backoff; logged as attempts
price_usd_per_mtok:         # from Google's pricing page on the run date; thinking tokens bill as output
  input: null                # TODO: fill before the cloud run, cost is not computed while null
  output: null
